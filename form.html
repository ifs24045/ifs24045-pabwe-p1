<h1>Form Pendaftaran Akun</h1>

<!-- Form pendaftaran, semua input dibungkus fieldset -->
<form>
<fieldset>
<legend>Daftar Akun</legend>

<!-- Nama lengkap: text -->
<p>Nama Lengkap: <input type="text" id="nama" name="nama"></p>
<hr>

<!-- Jenis kelamin: radio -->
<p>Jenis Kelamin:
<input type="radio" id="lk" name="gender" value="laki-laki"><label for="lk">Laki-Laki</label>
<input type="radio" id="pr" name="gender" value="perempuan"><label for="pr">Perempuan</label>
</p>
<hr>

<!-- Tempat lahir: text -->
<p>Tempat Lahir: <input type="text" id="tempat_lahir" name="tempat_lahir"></p>
<hr>

<!-- Tanggal lahir: date -->
<p>Tanggal Lahir: <input type="date" id="tanggal_lahir" name="tanggal_lahir"></p>
<hr>

<!-- Agama: select -->
<p>Agama:
<select id="agama" name="agama">
<option value="" selected disabled>--- Pilih Agama ---</option>
<option value="islam">Islam</option>
<option value="katolik">Katolik</option>
<option value="protestan">Protestan</option>
<option value="hindu">Hindu</option>
<option value="buddha">Buddha</option>
<option value="konghucu">Konghucu</option>
</select>
</p>
<hr>

<!-- Hobi: checkbox -->
<p>Hobi:
<input type="checkbox" id="hobi1" name="hobi" value="olahraga"><label for="hobi1">Olahraga</label>
<input type="checkbox" id="hobi2" name="hobi" value="membaca"><label for="hobi2">Membaca</label>
<input type="checkbox" id="hobi3" name="hobi" value="ngoding"><label for="hobi3">Ngoding</label>
</p>
<hr>

<!-- Password -->
<p>Password: <input type="password" id="password" name="password"></p>
<hr>

<!-- Persetujuan: checkbox -->
<p>
<input type="checkbox" id="setuju" name="setuju" value="ya">
<label for="setuju">Dengan mendaftar saya setuju dengan Ketentuan dan Kebijakan Privasi Aplikasi.</label>
</p>

<!-- Tombol reset dan submit -->
<p>
<input type="reset" value="Reset">
<input type="submit" value="Submit">
</p>

</fieldset>
</form>

</body>
</html>
